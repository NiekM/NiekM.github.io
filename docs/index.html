<!DOCTYPE HTML>
<html>
<head>
  <meta charset="UTF-8">
  <title>Vibe</title>
  <style>body { padding: 0; margin: 0; }</style>
</head>
<body>
  <div id="elm"></div>
  <script src="elm.js"></script>
  <script>
    var stored = sessionStorage.redirect;
    delete sessionStorage.redirect;
    if (stored && location.pathname === "/") {
      history.replaceState(null, null, stored);
    }
  </script>
  <script>
    Elm.Main.init({
      node: document.getElementById("elm")
    });
  </script>
</body>
</html>
